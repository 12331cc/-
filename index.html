    <style>
      :root { color-scheme: dark; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; background: #170b27; }
      #root { min-height: 100svh; }
      .boot-screen {
        min-height: 100svh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 24px;
        color: rgba(255, 245, 251, .86);
        background: radial-gradient(circle at 50% 36%, #3b1b55 0, #251039 42%, #170b27 100%);
        font: 12px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .08em;
        text-align: center;
      }
      .boot-screen__inner { display: grid; justify-items: center; gap: 12px; }
      .boot-screen__mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 225, 249, .6);
        border-radius: 50%;
        color: #ffe1f5;
        box-shadow: 0 0 24px rgba(216, 154, 255, .32);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-screen__retry { color: rgba(255, 225, 249, .72); }
      @keyframes boot-pulse { 50% { transform: scale(1.08); opacity: .62; } }
      @media (prefers-reduced-motion: reduce) { .boot-screen__mark { animation: none; } }
    </style>
